<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Shortly - Shorten your links</title>
</head>
<body>
    <main class="page-shell">
        <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Switch to light mode"
        >
            <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
            </svg>
            <span class="sr-only">Switch color theme</span>
        </button>

        <section class="card" aria-labelledby="page-title">
            <p class="eyebrow">Simple, reliable links</p>
            <h1 id="page-title">Shortly.</h1>
            <p class="intro">
                Create a clean, shareable URL with an optional custom alias and expiration date.
            </p>

            <form id="shorten-form" novalidate>
                <label for="longUrl">Destination URL</label>
                <input
                    id="longUrl"
                    name="original_url"
                    type="url"
                    inputmode="url"
                    placeholder="https://example.com/a-very-long-link"
                    autocomplete="url"
                    required
                >

                <div class="field-row">
                    <div>
                        <label for="customUrl">Custom alias <span>(optional)</span></label>
                        <input
                            id="customUrl"
                            name="custom_url"
                            type="text"
                            placeholder="my-link"
                            minlength="3"
                            maxlength="32"
                            pattern="[A-Za-z0-9_-]+"
                            autocomplete="off"
                        >
                    </div>

                    <div>
                        <label for="expiryTime">Expires</label>
                        <select id="expiryTime" name="expires_in_hours">
                            <option value="">Never</option>
                            <option value="1">In 1 hour</option>
                            <option value="24">In 24 hours</option>
                            <option value="168">In 7 days</option>
                        </select>
                    </div>
                </div>

                <p id="errorMsg" class="message error" role="alert" aria-live="polite"></p>
                <button id="shortenBtn" class="primary-button" type="submit">Shorten URL</button>
            </form>

            <section id="result" class="result" hidden aria-live="polite">
                <p class="result-label">Your short link is ready</p>
                <div class="result-row">
                    <a id="short-link" target="_blank" rel="noopener noreferrer"></a>
                    <button id="copy-button" class="copy-button" type="button">Copy</button>
                </div>
            </section>
        </section>

        <p class="footer">Built with Python, Flask, JavaScript, and PostgreSQL.</p>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon/favicon.svg') }}">
    <link rel="icon" type="image/png" sizes="96x96" href="{{ url_for('static', filename='favicon/favicon-96x96.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
    <title>Shortly - Shorten your links</title>
</head>
<body>
    <main class="page-shell">
        <header class="brand-header" aria-labelledby="page-title">
            <div class="brand-lockup">
                <h1 id="page-title">Shortly.</h1>
            </div>
            <p class="intro">
                Create a clean, shareable URL with an optional custom alias and expiration date.
            </p>
        </header>

        <section class="card form-card" aria-label="Create a short link">
            <form id="shorten-form" novalidate>
                <div class="form-fields">
                    <label for="longUrl">Destination URL</label>
                    <input
                        id="longUrl"
                        name="original_url"
                        type="url"
                        inputmode="url"
                        placeholder="https://example.com/a-very-long-link"
                        autocomplete="url"
                        required
                    >

                    <div class="field-row">
                        <div>
                            <label for="customUrl">Custom alias <span>(optional)</span></label>
                            <input
                                id="customUrl"
                                name="custom_url"
                                type="text"
                                placeholder="my-link"
                                minlength="3"
                                maxlength="32"
                                pattern="[A-Za-z0-9_-]+"
                                autocomplete="off"
                            >
                        </div>

                        <div>
                            <label for="expiryTime">Expires</label>
                            <select id="expiryTime" name="expires_in_hours">
                                <option value="1" selected>In 1 hour</option>
                                <option value="24">In 24 hours</option>
                                <option value="168">In 7 days</option>
                                <option value="">Never</option>
                            </select>
                        </div>
                    </div>

                    <p id="errorMsg" class="message error" role="alert" aria-live="polite"></p>
                </div>
                <button id="shortenBtn" class="primary-button" type="submit">Shorten URL</button>
            </form>
        </section>

        <section id="result" class="result" hidden aria-live="polite">
            <p class="result-label">Your short link is ready</p>
            <div class="result-row">
                <a id="short-link" target="_blank" rel="noopener noreferrer"></a>
                <button id="copy-button" class="copy-button" type="button">Copy</button>
            </div>
        </section>

        <p class="footer">Built with Python, Flask, JavaScript, and PostgreSQL.</p>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>

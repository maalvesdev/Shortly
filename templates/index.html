<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>URL Shortener</title>
</head>
<body>

<main class="page-shell">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch color theme">◐ <span>Theme</span></button>
    <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">Simple, reliable links</p><h1 id="page-title">Shorten a link.</h1>
        <p class="intro">Create a clean, shareable URL with an optional custom alias and expiration date.</p>
        <form id="shorten-form" novalidate>
            <label for="longUrl">Destination URL</label><input id="longUrl" name="original_url" type="url" inputmode="url" placeholder="https://example.com/a-very-long-link" autocomplete="url" required>
            <div class="field-row"><div><label for="customUrl">Custom alias <span>(optional)</span></label><input id="customUrl" name="custom_url" type="text" placeholder="my-link" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" autocomplete="off"></div><div><label for="expiryTime">Expires</label><select id="expiryTime" name="expires_in_hours"><option value="">Never</option><option value="1">In 1 hour</option><option value="24">In 24 hours</option><option value="168">In 7 days</option></select></div></div>
            <p id="errorMsg" class="message error" role="alert" aria-live="polite"></p><button id="shortenBtn" class="primary-button" type="submit">Shorten URL <span aria-hidden="true">→</span></button>
        </form>
        <section id="result" class="result" hidden aria-live="polite"><p class="result-label">Your short link is ready</p><div class="result-row"><a id="short-link" target="_blank" rel="noopener noreferrer"></a><button id="copy-button" class="copy-button" type="button">Copy</button></div></section>
    </section><p class="footer">Built with Flask, SQLite, Javascript and Python.</p>
</main>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
